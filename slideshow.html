<p>Slideshow: </p>
<div class="myContainer">
  <div class="slides">
	  <img src="20260817_115304(1).jpg" style="width:100%">
  </div>
  <div class="slides">
	  <img src="20260817_140642(1).jpg" style="width:100%">
  <div class="slides">
	  <img src="20260818_161251(1).jpg" style="width:100%">
  </div>
  <div class="slides">
	  <img src="20260818_165520(1).jpg" style="width:100%">
  </div>
  <a class="previous" onclick="plusSlides(-1)">&lt;</a>
  <a class="next" onclick="plusSlides(1)">&gt;</a>
  <div class="caption-container">
	<p id="caption"></p>
  </div>
  <div class="row">
	<div class="column">
		<img class="demo-cursor" src="20260817_115304(1).jpg" style="width:100%" onclick="currentSlide(1)" alt="Louis">
	</div>
	<div class="column">
		<img class="demo-cursor" src="20260817_140642(1).jpg" style="width:100%" onclick="currentSlide(2)" alt="Aaron">
	</div>
	<div class="column">
		<img class="demo-cursor" src="20260818_161251(1).jpg" style="width:100%" onclick="currentSlide(3)" alt="Jaden">
	</div>
  </div>
</div>
<script>
	let slideIndex = 1;
showSlides (slideIndex);

function plusSlides(n) {
   showSlides(slideIndex += n);
}
function currentSlide(n) {
  showSlides(slideIndex = n);
}
function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
  captionText.innerHTML = dots[slideIndex-1].alt;
}
</script>
